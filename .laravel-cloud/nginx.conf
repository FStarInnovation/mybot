location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Правильные MIME-типы для SvelteKit ассетов
location ~ \.js$ {
    add_header Content-Type "text/javascript";
}

location ~ \.css$ {
    add_header Content-Type "text/css";
}

location ~ \.webmanifest$ {
    add_header Content-Type "application/manifest+json";
}

# Для SvelteKit
location /build/_app/immutable/entry/ {
    try_files $uri $uri/ =404;
    add_header Content-Type "text/javascript";
}

location /build/_app/immutable/chunks/ {
    try_files $uri $uri/ =404;
    add_header Content-Type "text/javascript";
}

location /build/_app/immutable/assets/ {
    try_files $uri $uri/ =404;
    add_header Content-Type "text/css";
}

# Для Service Worker
location = /build/registerSW.js {
    add_header Content-Type "text/javascript";
}

location = /build/sw.js {
    add_header Content-Type "text/javascript";
}

# Кэширование статических ассетов
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
