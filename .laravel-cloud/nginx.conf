# Основной маршрут для Laravel
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# SvelteKit и другие статические файлы в /build
location ^~ /build/ {
    alias /var/www/html/public/build/;
    add_header "Access-Control-Allow-Origin" "*" always;
    add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
    add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
    
    # JavaScript файлы
    location ~* \.js$ {
        add_header Content-Type "text/javascript" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    
    # CSS файлы
    location ~* \.css$ {
        add_header Content-Type "text/css" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    
    # WebManifest файлы
    location ~* \.webmanifest$ {
        add_header Content-Type "application/manifest+json" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    
    # Service Worker файлы
    location = /build/registerSW.js {
        add_header Content-Type "text/javascript" always;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    
    location = /build/sw.js {
        add_header Content-Type "text/javascript" always;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    
    # Изображения и другие статические файлы
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    
    # Для остальных файлов в /build
    try_files $uri =404;
}
