hooks:
  prePublish:
    - description: Seeding cache headers for assets
      script: |
        echo "Setting up cache headers for assets..."
        cd $LARAVEL_CLOUD_APP_DIR
        
        # Создаем .htaccess файл для правильных MIME-типов
        cat > public/.htaccess.append << EOF
        
        # Правильные MIME типы для SvelteKit ассетов
        <IfModule mod_mime.c>
          AddType text/javascript .js
          AddType text/css .css
          AddType application/manifest+json .webmanifest
        </IfModule>
        
        # Кэширование для статических ассетов
        <IfModule mod_expires.c>
          ExpiresActive on
          ExpiresByType text/javascript "access plus 1 month"
          ExpiresByType text/css "access plus 1 month"
          ExpiresByType application/manifest+json "access plus 1 month"
          ExpiresByType image/png "access plus 1 month"
          ExpiresByType image/jpeg "access plus 1 month"
          ExpiresByType image/gif "access plus 1 month"
          ExpiresByType image/svg+xml "access plus 1 month"
        </IfModule>
        EOF
        
        # Добавляем настройки MIME-типов в основной .htaccess
        cat public/.htaccess.append >> public/.htaccess
        rm public/.htaccess.append
        
        echo "Cache headers setup completed!"
