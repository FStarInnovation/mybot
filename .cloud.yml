runtime:
  php: "8.4"

build:
  commands:
    - composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    - php artisan vendor:publish --provider="Laravel\Telescope\TelescopeServiceProvider" --tag="telescope-assets" --force
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache

start:
  command: |
    # php-fpm in foreground (flag -F)
    php-fpm -F &

    # nginx as main PID 1 (exec replaces current shell)
    exec nginx -g 'daemon off;'
