runtime:
  php: "8.4"

build:
  commands:
    - composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    - npm ci --prefix frontend
    - npm run build --prefix frontend
    - mkdir -p public/build && cp -R frontend/build/* public/build/
    - sed -i 's/"\/build\/pwa-/"\/pwa-/g' public/build/manifest.webmanifest
    - cp public/build/manifest.webmanifest public/manifest.webmanifest
    - cp public/build/pwa-192x192.png public/
    - cp public/build/pwa-512x512.png public/
    - cp public/build/registerSW.js public/
    - cp public/build/sw.js public/
    - cp public/build/workbox-*.js public/
    # Remove manifest from SW precache to avoid stale manifest caching
    - sed -i '/url\": \"manifest.webmanifest\"/{N;N;d;}' public/sw.js
    - php artisan config:clear
    - php artisan route:clear
    - php artisan view:clear
    - php artisan optimize

start:
  command: |
    # Clear route cache to ensure new routes are loaded
    php artisan route:clear
    php artisan config:clear
    
    # php-fpm in foreground (flag -F)
    php-fpm -F &

    # nginx as main PID 1 (exec replaces current shell)
    exec nginx -g 'daemon off;'
