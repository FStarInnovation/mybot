name: mybot
services:
  app:
    webserver:
      nginx_inline: |
        # Разрешаем eval в CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        
        # Открываем доступ к статическим ресурсам SvelteKit
        location /_app/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
        
        # Специальная обработка для /chat и других SPA маршрутов
        location /chat {
            try_files $uri $uri/ /index.html;
        }
        
        location / {
           # First try static files, then Laravel routes, then fall back to SPA index.html
           # SPA-first fallback: static -> /index.html -> Laravel
           try_files $uri $uri/ /index.html /index.php?$query_string;
        }
    
    build:
      dockerfile: Dockerfile
    resources:
      cpu: 1
      memory: 512
    domains:
      - mybot.laravel.app
    env:
      APP_ENV: production
      APP_KEY: base64:xxx
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${NEON_DB_HOST}
      DB_PORT: 5432
      DB_DATABASE: neondb
      DB_USERNAME: ${NEON_DB_USERNAME}
      DB_PASSWORD: ${NEON_DB_PASSWORD}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_URL: ${UPSTASH_REDIS_URL}
      REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}
    health_check:
      url: /health
