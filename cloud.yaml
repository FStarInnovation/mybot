name: mybot
services:
  app:
    webserver:
      nginx_inline: |
        # Разрешаем eval в CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";
        
        # Открываем доступ к статическим ресурсам SvelteKit
        location /_app/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
        
        # Специальная обработка для /chat и других SPA маршрутов
        location /chat {
            try_files $uri $uri/ /index.html;
        }
        
        # Приоритетная обработка для API маршрутов
        location /api {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        location / {
           # First try static files, then Laravel routes, then fall back to SPA index.html
           # SPA-first fallback: static -> /index.html -> Laravel
           try_files $uri $uri/ /index.html /index.php?$query_string;
        }
    
    build:
      dockerfile: Dockerfile
    resources:
      cpu: 1
      memory: 512
    domains:
      - mybot.laravel.app
    env:
      APP_ENV: production
      APP_KEY: base64:5Nfcv1c6LN1ipS7c4/3iH1G9DYDHdnk/m/Xw++jgH0Q=
      LOG_CHANNEL: stderr
      
      # База данных PostgreSQL (Neon)
      DB_CONNECTION: pgsql
      DB_HOST: ep-small-thunder-a4xssxb3-pooler.us-east-1.aws.neon.tech
      DB_PORT: 5432
      DB_DATABASE: neondb
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_d4my6EWUeDvM
      
      # Redis и очереди
      QUEUE_CONNECTION: database
      REDIS_CLIENT: predis
      REDIS_URL: rediss://default:ATiUAAIjcDFkMjMxZDA5ZWQ2NTU0ZjlhYWM5MTM0OWVjNDY3YmUwZnAxMA@fitting-elk-14484.upstash.io:6379
      REDIS_TIMEOUT: 10
      REDIS_READ_TIMEOUT: 10
      
      # LLM и API
