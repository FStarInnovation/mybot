name: mybot
services:
  app:
    # Важно! Nginx должен быть перед build
    webserver:
      nginx_inline: |
        root /var/www/html/public;
        index index.php index.html;
        
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    
    build:
      dockerfile: Dockerfile
    resources:
      cpu: 1
      memory: 512
    domains:
      - mybot.laravel.app
    env:
      APP_ENV: production
      APP_KEY: base64:xxx # заменим позже
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${NEON_DB_HOST}
      DB_PORT: 5432
      DB_DATABASE: neondb
      DB_USERNAME: ${NEON_DB_USERNAME}
      DB_PASSWORD: ${NEON_DB_PASSWORD}
      
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_URL: ${UPSTASH_REDIS_URL}
      REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}
