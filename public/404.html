<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена - St. Anna</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 2rem;
      color: #6b7280;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-right: 0.5rem;
    }
    button:hover {
      background-color: #2563eb;
    }
    .secondary {
      background-color: #9ca3af;
    }
    .secondary:hover {
      background-color: #6b7280;
    }
  </style>
  <script>
    // Перенаправление на главную страницу через 5 секунд
    setTimeout(function() {
      window.location.href = '/';
    }, 5000);
    
    // Функция для перехода на чат
    function goToChat() {
      window.location.href = '/';
    }
    
    // Функция для возврата назад
    function goBack() {
      window.history.back();
    }
  </script>
</head>
<body>
  <h1>Страница не найдена</h1>
  <p>Запрашиваемая страница не существует. Вы будете автоматически перенаправлены на главную страницу через 5 секунд.</p>
  <div>
    <button onclick="goToChat()">Перейти в чат</button>
    <button class="secondary" onclick="goBack()">Вернуться назад</button>
  </div>
</body>
</html>
