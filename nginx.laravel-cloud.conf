location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
    try_files $uri $uri/ /index.php?$query_string;
}

# Настройка MIME-типов для SvelteKit ассетов
location ~ ^/build/_app/.*\.js$ {
    types { 
        text/javascript js;
    }
    add_header Content-Type text/javascript;
}

location ~ ^/build/_app/.*\.css$ {
    types { 
        text/css css;
    }
    add_header Content-Type text/css;
}

location ~ ^/build/.*\.webmanifest$ {
    types { 
        application/manifest+json webmanifest;
    }
    add_header Content-Type application/manifest+json;
}

# Кэширование статических ассетов
location ~ ^/build/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# Настройка для Service Worker
location = /build/registerSW.js {
    add_header Content-Type text/javascript;
}

location = /build/sw.js {
    add_header Content-Type text/javascript;
}

location = /manifest.webmanifest {
    add_header Content-Type application/manifest+json;
    try_files $uri =404;
}

location = /sw.js {
    add_header Content-Type text/javascript;
    try_files $uri =404;
}

location = /registerSW.js {
    add_header Content-Type text/javascript;
    try_files $uri =404;
}
